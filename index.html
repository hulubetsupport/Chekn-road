<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chicken Road 2 - InOut Official Edition</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #121418;
      --card-dark: #1e2229;
      --border-color: #2b313a;
      --accent-green: #00c853;
      --accent-green-hover: #00e676;
      --accent-gold: #ffb300;
      --accent-red: #ff3344;
      --asphalt-gray: #3a3e46;
      --text-gray: #8c939e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; }
    
    .game-wrapper {
      width: 100%; height: 100vh; background: var(--bg-dark);
      display: flex; flex-direction: column; position: relative; margin: 0 auto; max-width: 480px;
    }

    /* 1. Header */
    .brand-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: #121418; border-bottom: 1px solid #1c1f26; z-index: 50; flex-shrink: 0;
    }
    .chicken-logo { font-size: 19px; font-weight: 900; color: #fff; letter-spacing: -0.5px; display: flex; align-items: center; gap: 4px; }
    .chicken-logo span { color: var(--accent-red); font-size: 21px; font-style: italic; }
    
    .header-right-meta { display: flex; align-items: center; gap: 8px; }
    .bal-pill {
      background: #1c1f26; border: 1px solid #2d3239; border-radius: 12px;
      padding: 4px 10px; font-size: 12px; font-weight: 900; color: var(--accent-green);
    }

    /* 2. Road Arena with Continuous Traffic */
    .road-arena {
      flex: 1; min-height: 0; background: var(--asphalt-gray); position: relative;
      overflow-x: auto; overflow-y: hidden; display: flex; scrollbar-width: none;
    }
    .road-arena::-webkit-scrollbar { display: none; }

    /* Sidewalk Start Area */
    .sidewalk-start {
      width: 95px; height: 100%; background: #7e8188; border-right: 4px solid #5b5d63;
      position: relative; flex-shrink: 0; display: flex; flex-direction: column; justify-content: space-around; padding-left: 10px; z-index: 10;
    }
    .bush { width: 44px; height: 44px; border-radius: 50%; background: #43a047; border: 3px solid #2e7d32; }

    /* Traffic Canvas */
    #roadCanvas { position: absolute; top: 0; left: 95px; width: 680px; height: 100%; z-index: 15; pointer-events: none; }

    /* Chicken Sprite */
    .chicken-sprite {
      width: 48px; height: 48px; position: absolute; top: 150px; left: 24px;
      z-index: 30; transition: left 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .chicken-sprite.waddle { animation: waddleAnim 0.2s infinite alternate; }

    /* Highway Lanes with Manhole Covers */
    .highway-strip { display: flex; height: 100%; position: relative; padding-left: 95px; padding-right: 80px; z-index: 20; }
    .lane-block {
      width: 85px; height: 100%; position: relative; display: flex; flex-direction: column;
      align-items: center; justify-content: center; flex-shrink: 0;
    }

    .manhole-step {
      width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle, #686c75 0%, #36383d 100%);
      border: 3px solid #25272b; box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), 0 4px 10px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
    }
    .manhole-step.active-step {
      border-color: var(--accent-green); box-shadow: 0 0 16px var(--accent-green); animation: pulseStep 0.8s infinite alternate;
    }
    .manhole-step.passed { background: radial-gradient(circle, #2e7d32 0%, #1b5e20 100%); border-color: #4caf50; }
    .manhole-mult-text { font-size: 13px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px #000; }
    .manhole-grate-lines { width: 30px; height: 2px; background: #222326; margin-top: 3px; border-radius: 2px; }

    /* 3. Bottom Controls Panel */
    .controls-panel {
      background: #1a1d22; border-top: 1px solid var(--border-color); padding: 8px 12px 12px;
      display: flex; flex-direction: column; gap: 6px; z-index: 50; flex-shrink: 0;
    }
    .stepper-row {
      display: flex; align-items: center; justify-content: space-between; background: #252a32; border-radius: 6px; padding: 3px;
    }
    .btn-limit { background: #323842; border: none; color: #fff; font-size: 11px; font-weight: 900; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .bet-amount-display { font-size: 16px; font-weight: 900; color: #fff; }

    .quick-chips-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .chip-btn {
      background: #252a32; border: 1px solid #323842; border-radius: 6px; padding: 6px 0;
      color: #fff; font-size: 11px; font-weight: 800; text-align: center; cursor: pointer;
    }

    /* Difficulty Selector Dropdown */
    .diff-selector-box { position: relative; }
    .diff-btn {
      width: 100%; background: #252a32; border: 1px solid #323842; border-radius: 6px;
      padding: 8px 12px; color: #fff; font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }
    .diff-dropdown-menu {
      display: none; position: absolute; bottom: 100%; left: 0; right: 0; background: #252a32;
      border: 1px solid #3c434f; border-radius: 6px; overflow: hidden; margin-bottom: 4px; box-shadow: 0 -8px 20px rgba(0,0,0,0.6); z-index: 60;
    }
    .diff-option {
      padding: 9px 12px; font-size: 12px; font-weight: bold; color: #ddd; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #323842;
    }
    .diff-option:hover { background: #323842; color: #fff; }
    .diff-option.selected { color: var(--accent-gold); }

    /* Action Play / Cash Out Button */
    .play-btn {
      width: 100%; background: var(--accent-green); color: #fff; font-size: 17px; font-weight: 900;
      border: none; border-radius: 8px; padding: 12px 0; cursor: pointer; transition: 0.15s; letter-spacing: 0.5px;
    }
    .play-btn.cashout { background: var(--accent-gold); color: #000; animation: pulsePlay 0.8s infinite alternate; }

    /* Floating Win Banner */
    .clean-win-banner {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #00c853, #00e676); color: #000; font-size: 13px; font-weight: 900;
      padding: 8px 20px; border-radius: 30px; box-shadow: 0 6px 25px rgba(0, 230, 118, 0.6);
      z-index: 9999; display: none; animation: popWin 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pulseStep { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }
    @keyframes pulsePlay { 0% { transform: scale(0.99); } 100% { transform: scale(1.02); } }
    @keyframes waddleAnim { 0% { transform: rotate(-8deg); } 100% { transform: rotate(8deg); } }
    @keyframes popWin { 0% { transform: translate(-50%, -20px) scale(0.8); opacity: 0; } 100% { transform: translate(-50%, 0) scale(1); opacity: 1; } }
  </style>
</head>
<body>

<div class="game-wrapper">
  <!-- Clean Win Banner -->
  <div class="clean-win-banner" id="cleanWinBanner">
    🎉 <span id="winBannerText">+0.00 ETB Cashed Out!</span>
  </div>

  <!-- 1. Header -->
  <div class="brand-header">
    <div class="chicken-logo">CHICKEN <span>2</span> ROAD</div>
    <div class="header-right-meta">
      <div class="bal-pill"><span id="userBalText">0.00</span> ETB</div>
    </div>
  </div>

  <!-- 2. Road Scene Visual Area -->
  <div class="road-arena" id="roadArenaScroll">
    <canvas id="roadCanvas" width="680" height="380"></canvas>

    <!-- Sidewalk Start Area -->
    <div class="sidewalk-start">
      <div class="bush"></div>
      <div class="bush"></div>
    </div>

    <!-- Chicken Character (SVG) -->
    <div class="chicken-sprite" id="chickenPlayer">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <ellipse cx="45" cy="55" rx="35" ry="30" fill="#ffffff" stroke="#d5d5d5" stroke-width="3"/>
        <path d="M40,25 Q35,10 48,18 Q55,8 60,22 Z" fill="#ff3344"/>
        <circle cx="55" cy="35" r="9" fill="#fff" stroke="#333" stroke-width="2"/><circle cx="58" cy="35" r="4" fill="#000"/>
        <polygon points="68,42 85,48 68,54" fill="#ffb300" stroke="#e65100" stroke-width="1.5"/>
        <ellipse cx="35" cy="58" rx="16" ry="12" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
        <path d="M35,82 L35,92 M30,92 L40,92 M50,82 L50,92 M45,92 L55,92" stroke="#ffb300" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- 8 Highway Lanes with Manholes -->
    <div class="highway-strip" id="highwayStrip"></div>
  </div>

  <!-- 3. Bottom Controls Panel -->
  <div class="controls-panel">
    <!-- Stepper Row -->
    <div class="stepper-row">
      <button class="btn-limit" onclick="setBet(4)">MIN</button>
      <div class="bet-amount-display"><span id="betDisplayVal">4</span> ETB</div>
      <button class="btn-limit" onclick="setBet(100)">MAX</button>
    </div>

    <!-- Quick Chips Row -->
    <div class="quick-chips-row">
      <div class="chip-btn" onclick="setBet(4)">4 ETB</div>
      <div class="chip-btn" onclick="setBet(8)">8 ETB</div>
      <div class="chip-btn" onclick="setBet(12)">12 ETB</div>
      <div class="chip-btn" onclick="setBet(20)">20 ETB</div>
    </div>

    <!-- Difficulty Selector Dropdown -->
    <div class="diff-selector-box">
      <div class="diff-btn" id="currentDiffBtn" onclick="toggleDiffDropdown()">
        <span id="currentDiffText">Easy</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </div>

      <div class="diff-dropdown-menu" id="diffDropdownMenu">
        <div class="diff-option selected" onclick="selectDifficulty('Easy')"><span>Easy (Low Risk)</span> <span id="check-Easy">✔</span></div>
        <div class="diff-option" onclick="selectDifficulty('Medium')"><span>Medium (Balanced)</span> <span id="check-Medium"></span></div>
        <div class="diff-option" onclick="selectDifficulty('Hard')"><span>Hard (High Risk)</span> <span id="check-Hard"></span></div>
        <div class="diff-option" onclick="selectDifficulty('Hardcore')"><span>Hardcore (Extreme)</span> <span id="check-Hardcore"></span></div>
      </div>
    </div>

    <!-- Main Play / Cash Out Button -->
    <button class="play-btn" id="mainActionBtn" onclick="handleMainAction()">Play</button>
  </div>
</div>

<script>
  // ============================================================================
  // 🚀 CHICKEN ROAD 2 - INTEGRATED WITH HULU BET RENDER BACKEND (/api/bet/play)
  // ============================================================================
  const RENDER_BASE_URL = "https://hulubet-server.onrender.com";

  // URL Injection: User ID & Balance from Main Lobby
  const urlParams = new URLSearchParams(window.location.search);
  let USER_ID = urlParams.get('userId') || "589218392";
  let balance = parseFloat(urlParams.get('balance')) || 20.00;

  function triggerCleanWin(msg) {
    const banner = document.getElementById("cleanWinBanner");
    document.getElementById("winBannerText").innerText = msg;
    banner.style.display = "block";
    setTimeout(() => { banner.style.display = "none"; }, 3500);
  }

  // Audio Synthesizer
  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function playTone(freq, type, dur) {
    try {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }
  const SOUNDS = {
    step: () => playTone(650, 'triangle', 0.08),
    cashout: () => { playTone(523, 'sine', 0.1); setTimeout(() => playTone(659, 'sine', 0.1), 80); setTimeout(() => playTone(783, 'sine', 0.25), 160); },
    crash: () => playTone(140, 'sawtooth', 0.3),
    click: () => playTone(800, 'sine', 0.03)
  };

  // Multiplier Ladders for 8 Highway Steps
  const DIFFICULTY_LADDERS = {
    Easy: [1.02, 1.05, 1.10, 1.18, 1.28, 1.45, 1.70, 2.10],
    Medium: [1.10, 1.25, 1.45, 1.75, 2.20, 2.90, 4.00, 6.00],
    Hard: [1.25, 1.70, 2.60, 4.20, 8.00, 16.00, 35.00, 75.00],
    Hardcore: [1.44, 2.20, 5.00, 12.00, 30.00, 100.00, 250.00, 1000.00]
  };

  let currentBet = 4;
  let currentDiff = "Easy";
  let inGame = false;
  let currentStep = 0;
  let serverMaxSafeStep = 8;
  let serverBetResult = null;

  function updateBalanceDisplay() {
    document.getElementById("userBalText").innerText = balance.toFixed(2);
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "BALANCE_UPDATE", newBalance: balance }, "*");
      }
    } catch(e) {}
  }
  updateBalanceDisplay();

  // Handshake with Lobby
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "GAME_READY" }, "*");
  }
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'INIT_BALANCE' || e.data?.type === 'UPDATE_BALANCE') {
      if (e.data.balance !== undefined) { balance = parseFloat(e.data.balance); updateBalanceDisplay(); }
      if (e.data.userId) USER_ID = String(e.data.userId);
    }
  });

  // -------------------------------------------------------------
  // 🚗 CONTINUOUS TRAFFIC CANVAS ENGINE
  // -------------------------------------------------------------
  const canvas = document.getElementById("roadCanvas");
  const ctx = canvas.getContext("2d");
  const vehicles = [];
  const VEHICLE_STYLES = [
    { type: "Sedan", color: "#42a5f5", length: 62, width: 40 },
    { type: "FireTruck", color: "#e53935", length: 85, width: 44 },
    { type: "Taxi", color: "#fbc02d", length: 60, width: 40 },
    { type: "Police", color: "#8e24aa", length: 62, width: 40 }
  ];

  function initTraffic() {
    vehicles.length = 0;
    const speedMult = currentDiff === "Easy" ? 1.0 : currentDiff === "Medium" ? 1.3 : 1.8;
    for (let lane = 1; lane <= 8; lane++) {
      const laneX = ((lane - 1) * 85) + (85 / 2);
      const style = VEHICLE_STYLES[(lane - 1) % VEHICLE_STYLES.length];
      const dir = lane % 2 === 0 ? 1 : -1;
      vehicles.push({
        lane: lane,
        x: laneX - (style.width / 2),
        y: Math.random() * 380,
        speed: (1.5 + Math.random() * 1.0) * speedMult * dir,
        style: style
      });
    }
  }
  initTraffic();

  function renderTraffic() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Dashed lines
    ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 10]);
    for (let l = 1; l < 8; l++) {
      ctx.beginPath(); ctx.moveTo(l * 85, 0); ctx.lineTo(l * 85, canvas.height); ctx.stroke();
    }
    ctx.setLineDash([]);

    // Vehicles
    vehicles.forEach(v => {
      v.y += v.speed;
      if (v.speed > 0 && v.y > canvas.height + 40) v.y = -v.style.length - 20;
      if (v.speed < 0 && v.y < -v.style.length - 40) v.y = canvas.height + 20;

      ctx.save();
      ctx.translate(v.x, v.y);
      ctx.fillStyle = v.style.color;
      ctx.beginPath(); ctx.roundRect(0, 0, v.style.width, v.style.length, 6); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
      // Windshield
      ctx.fillStyle = "#1e293b"; ctx.fillRect(4, 10, v.style.width - 8, 8);
      ctx.restore();
    });

    requestAnimationFrame(renderTraffic);
  }
  renderTraffic();

  // -------------------------------------------------------------
  // 🕹️ GAMEPLAY ENGINE (Calls Render Server /api/bet/play)
  // -------------------------------------------------------------
  function buildHighwayLanes() {
    const strip = document.getElementById("highwayStrip");
    strip.innerHTML = "";
    const mults = DIFFICULTY_LADDERS[currentDiff];

    for (let i = 1; i <= 8; i++) {
      strip.innerHTML += `
        <div class="lane-block" id="lane-${i}">
          <div class="manhole-step" id="step-${i}" onclick="takeStep(${i})">
            <div class="manhole-mult-text">${mults[i - 1]}x</div>
            <div class="manhole-grate-lines"></div>
            <div class="manhole-grate-lines"></div>
          </div>
        </div>
      `;
    }
  }
  buildHighwayLanes();

  async function handleMainAction() {
    if (!inGame) {
      if (currentBet > balance) {
        if (window.parent && window.parent !== window) window.parent.postMessage({ type: "OPEN_DEPOSIT" }, "*");
        return;
      }

      balance -= currentBet;
      updateBalanceDisplay();
      SOUNDS.step();

      inGame = true;
      currentStep = 0;

      // Consult Render Server Engine for ChickenRoad2
      try {
        const res = await fetch(`${RENDER_BASE_URL}/api/bet/play`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userId: USER_ID,
            gameName: "ChickenRoad2",
            betAmount: currentBet,
            clientData: { difficulty: currentDiff }
          })
        });
        const d = await res.json();
        if (d.success) {
          serverBetResult = d;
          serverMaxSafeStep = d.visualOutcome?.maxSafeStep || (d.isWin ? 8 : 3);
        } else {
          serverMaxSafeStep = 2;
        }
      } catch(e) {
        serverMaxSafeStep = 4;
      }

      document.getElementById("mainActionBtn").innerText = "Take Step 1";
      document.getElementById("mainActionBtn").className = "play-btn cashout";
      document.getElementById("step-1").classList.add("active-step");
      document.getElementById("diffDropdownMenu").style.display = "none";
    } else {
      if (currentStep > 0) {
        executeCashout();
      } else {
        takeStep(1);
      }
    }
  }

  function takeStep(stepIndex) {
    if (!inGame || stepIndex !== currentStep + 1) return;
    SOUNDS.step();
    currentStep = stepIndex;

    const chicken = document.getElementById("chickenPlayer");
    const targetX = 95 + ((stepIndex - 1) * 85) + (85 / 2) - 24;
    chicken.style.left = targetX + "px";
    chicken.classList.add("waddle");
    setTimeout(() => chicken.classList.remove("waddle"), 220);

    // Auto-scroll track
    document.getElementById("roadArenaScroll").scrollTo({ left: targetX - 140, behavior: 'smooth' });

    // Server-enforced Crash Check
    if (stepIndex > serverMaxSafeStep) {
      triggerRoadCrash();
      return;
    }

    document.getElementById(`step-${stepIndex}`).classList.remove("active-step");
    document.getElementById(`step-${stepIndex}`).classList.add("passed");

    if (stepIndex < 8) {
      document.getElementById(`step-${stepIndex + 1}`).classList.add("active-step");
    }

    const mult = DIFFICULTY_LADDERS[currentDiff][stepIndex - 1];
    const liveWin = (currentBet * mult).toFixed(2);
    document.getElementById("mainActionBtn").innerText = `CASH OUT ${liveWin} ETB (${mult}x)`;

    if (stepIndex === 8) {
      setTimeout(() => executeCashout(), 350);
    }
  }

  function triggerRoadCrash() {
    inGame = false;
    SOUNDS.crash();

    const chicken = document.getElementById("chickenPlayer");
    chicken.style.transform = "rotate(90deg) scale(0.85)";

    triggerCleanWin(`💥 Smashed on Lane ${currentStep}! Bet lost.`);
    setTimeout(() => { resetGameUI(); }, 1800);
  }

  function executeCashout() {
    if (!inGame || currentStep === 0) return;
    inGame = false;

    const mult = DIFFICULTY_LADDERS[currentDiff][currentStep - 1];
    const winAmt = Number((currentBet * mult).toFixed(2));
    balance += winAmt;
    if (serverBetResult && serverBetResult.newBalance && currentStep === 8) {
      balance = serverBetResult.newBalance;
    }

    updateBalanceDisplay();
    SOUNDS.cashout();
    triggerCleanWin(`🎉 +${winAmt.toFixed(2)} ETB Cashed Out @ ${mult.toFixed(2)}x!`);
    resetGameUI();
  }

  function resetGameUI() {
    inGame = false;
    currentStep = 0;
    const chicken = document.getElementById("chickenPlayer");
    chicken.style.left = "24px";
    chicken.style.transform = "none";

    document.getElementById("roadArenaScroll").scrollTo({ left: 0, behavior: 'smooth' });
    buildHighwayLanes();

    const btn = document.getElementById("mainActionBtn");
    btn.className = "play-btn";
    btn.innerText = "Play";
  }

  function setBet(val) {
    if (inGame) return;
    SOUNDS.click();
    currentBet = Math.min(balance > 0 ? balance : 100, val);
    document.getElementById("betDisplayVal").innerText = currentBet;
  }

  function toggleDiffDropdown() {
    if (inGame) return;
    const menu = document.getElementById("diffDropdownMenu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
  }

  function selectDifficulty(diff) {
    currentDiff = diff;
    document.getElementById("currentDiffText").innerText = diff;
    document.querySelectorAll(".diff-option").forEach(el => el.classList.remove("selected"));
    ["Easy", "Medium", "Hard", "Hardcore"].forEach(d => {
      document.getElementById(`check-${d}`).innerText = d === diff ? "✔" : "";
    });
    buildHighwayLanes();
    initTraffic();
    document.getElementById("diffDropdownMenu").style.display = "none";
  }
</script>
</body>
</html>
