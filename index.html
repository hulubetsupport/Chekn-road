<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chicken Road 2 - Hulu Bet</title>
  <style>
    :root {
      --bg-dark: #1e2027;
      --panel-bg: #262932;
      --card-bg: #323643;
      --card-border: #3f4555;
      --green-btn: #3ec85a;
      --green-shadow: #28a742;
      --yellow-btn: #f7c343;
      --yellow-shadow: #cfa12b;
      --road-color: #63656c;
      --sidewalk: #c0c4cd;
      --grass: #84bf41;
      --text-white: #ffffff;
      --text-dim: #9aa1b3;
      --traffic-duration: 6.5s; /* Easy default */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background: #111216;
      color: var(--text-white);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-app {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-dark);
      overflow: hidden;
    }

    /* Top Bar */
    header {
      height: 50px;
      background: #242731;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 30;
      border-bottom: 1px solid #1a1c23;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .logo-text {
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
    }
    .logo-badge {
      background: #ef4444;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 4px;
      margin: 0 3px;
    }
    .logo-star {
      width: 14px;
      height: 14px;
      margin-left: 2px;
      display: inline-block;
      vertical-align: middle;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .balance-pill {
      background: #393e4d;
      border-radius: 18px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 0.88rem;
    }
    .balance-coin {
      width: 18px;
      height: 18px;
      background: #f59e0b;
      color: #fff;
      border-radius: 50%;
      font-size: 0.55rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    /* Game World Viewport */
    #world-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--road-color);
    }

    #world-track {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      display: flex;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Sidewalk / Grass Start */
    .sidewalk-area {
      width: 140px;
      height: 100%;
      background: var(--sidewalk);
      position: relative;
      border-right: 4px solid #9499a5;
      flex-shrink: 0;
    }
    .grass-strip {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 48px;
      background: var(--grass);
      border-right: 3px solid #6b9e30;
    }
    .bush {
      position: absolute;
      background: #669a2d;
      border-radius: 50%;
    }
    .lamp-post {
      position: absolute;
      left: 60px;
      top: 70px;
      z-index: 5;
    }
    .lamp-glow {
      position: absolute;
      left: 30px;
      top: 40px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.45) 0%, rgba(254, 240, 138, 0) 70%);
      pointer-events: none;
      z-index: 4;
    }

    /* Lanes & Continual Traffic */
    .lane {
      width: 130px;
      height: 100%;
      position: relative;
      border-right: 3px dashed rgba(255, 255, 255, 0.65);
      flex-shrink: 0;
      overflow: hidden;
    }

    .traffic-car-container {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      z-index: 8;
      top: -200px;
    }

    /* Continuous driving loop */
    .driving-active {
      animation: driveDown var(--traffic-duration) linear infinite;
    }

    @keyframes driveDown {
      0% { top: -200px; }
      100% { top: 110%; }
    }

    /* Blocked vehicle stopped behind barricade */
    .traffic-car-container.blocked-by-barrier {
      animation: none !important;
      top: 25px !important;
      transition: top 0.4s ease-out;
    }

    /* Crash hit animation */
    .traffic-car-container.speed-crash {
      animation: none !important;
      transition: top 0.12s cubic-bezier(0.5, 0, 1, 1) !important;
      top: 220px !important;
    }

    /* Barricade (Safety Breaker) */
    .lane-barricade {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      top: 145px;
      width: 96px;
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      transition: all 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .lane-barricade.deployed {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Manhole Covers */
    .manhole {
      position: absolute;
      bottom: 115px;
      left: 50%;
      transform: translateX(-50%);
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle, #55575e 0%, #3e4046 70%, #282a2e 100%);
      border: 3px solid #6f7179;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.6), 0 4px 8px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .manhole-bars {
      position: absolute;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 2px solid #5a5c64;
      opacity: 0.6;
    }
    .manhole-mult {
      font-size: 1.15rem;
      font-weight: 900;
      color: #e5e7eb;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      z-index: 3;
    }
    .manhole.passed {
      opacity: 0.45;
    }

    /* Real Chicken Entity */
    #chicken {
      position: absolute;
      bottom: 130px;
      left: 70px;
      width: 78px;
      height: 78px;
      z-index: 20;
      transform: translate(-50%, 0);
      transition: left 0.35s cubic-bezier(0.34, 1.4, 0.64, 1), bottom 0.25s ease-out;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .chicken-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.35));
      animation: chickenIdle 1.2s infinite ease-in-out;
    }
    @keyframes chickenIdle {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.02); }
    }

    /* Chicken Step Multiplier Tooltip */
    #mult-bubble {
      position: absolute;
      bottom: -32px;
      background: #2b3952;
      border: 2px solid #3b82f6;
      border-radius: 7px;
      padding: 2px 9px;
      font-size: 0.85rem;
      font-weight: 900;
      color: #fff;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      display: none;
    }
    #mult-bubble::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 6px solid #3b82f6;
    }

    /* Win Celebration Pill */
    #win-pill {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: #276749;
      border: 2px solid #38a169;
      border-radius: 20px;
      padding: 6px 20px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #win-pill.show {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }
    .win-tag {
      background: #f6c343;
      color: #000;
      font-weight: 900;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 2px;
      text-transform: uppercase;
    }
    .win-val {
      font-size: 1.15rem;
      font-weight: 900;
      color: #fff;
    }

    /* Pure SVG Error Toast */
    #toast {
      position: absolute;
      top: 58px;
      right: 12px;
      background: #ef4444;
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      z-index: 100;
      transform: translateY(-20px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
    }
    #toast.show {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .toast-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      fill: #ffffff;
    }
    .toast-close {
      cursor: pointer;
      display: flex;
      align-items: center;
      margin-left: 4px;
    }

    /* Bottom Control Panel */
    #control-panel {
      background: var(--panel-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 16px 14px 20px;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.4);
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Row 1: Bet Stepper */
    .stepper-row {
      background: var(--card-bg);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 3px 6px;
    }
    .step-btn {
      background: #2b2e38;
      border: none;
      color: var(--text-dim);
      font-weight: 800;
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .step-btn:active {
      background: #393d4a;
    }
    .bet-input-box {
      background: transparent;
      border: none;
      color: #fff;
      font-weight: 800;
      font-size: 1.15rem;
      text-align: center;
      width: 100px;
      outline: none;
    }

    /* Row 2: Quick Chips */
    .chips-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .chip-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .chip-btn:active {
      background: #414757;
    }
    .chip-sub {
      background: #4b5263;
      font-size: 0.6rem;
      padding: 1px 4px;
      border-radius: 6px;
      color: #cbd5e1;
    }

    /* Row 3: Difficulty Dropdown */
    .dropdown-container {
      position: relative;
    }
    .dropdown-trigger {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .dropdown-arrow {
      width: 12px;
      height: 12px;
      fill: var(--text-dim);
      transition: transform 0.2s ease;
    }
    .dropdown-menu {
      position: absolute;
      bottom: 50px;
      left: 0;
      right: 0;
      background: #23262f;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      display: none;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 60;
    }
    .dropdown-menu.open {
      display: flex;
    }
    .dropdown-item {
      padding: 12px 16px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border-bottom: 1px solid #2d313c;
    }
    .dropdown-item:last-child {
      border-bottom: none;
    }
    .dropdown-item:active {
      background: #313542;
    }
    .dropdown-item.active {
      color: #f59e0b;
    }

    /* Row 4: Action Buttons */
    .actions-row {
      position: relative;
      height: 56px;
    }
    .big-btn {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      border: none;
      font-size: 1.3rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.05s ease;
    }
    .big-btn:active {
      transform: translateY(2px);
    }
    .btn-play {
      background: var(--green-btn);
      color: #ffffff;
      box-shadow: 0 5px 0 var(--green-shadow);
    }

    /* Dual In-Game Buttons */
    .ingame-btns {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      height: 100%;
    }
    .btn-cashout {
      background: var(--yellow-btn);
      color: #111;
      box-shadow: 0 5px 0 var(--yellow-shadow);
      flex-direction: column;
      font-size: 0.95rem;
      line-height: 1.15;
    }
    .btn-cashout span {
      font-size: 1.05rem;
      font-weight: 900;
    }
    .btn-go {
      background: var(--green-btn);
      color: #ffffff;
      box-shadow: 0 5px 0 var(--green-shadow);
      font-size: 1.35rem;
    }

    .btn-disabled {
      opacity: 0.6;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="game-app">
  <!-- Top Bar -->
  <header>
    <div class="logo-container">
      <div class="logo-text">
        CHICKEN <span class="logo-badge">2</span> R
        <svg class="logo-star" viewBox="0 0 24 24" fill="#f59e0b">
          <circle cx="12" cy="12" r="10" stroke="#f59e0b" stroke-width="2" fill="none"/>
          <path d="M12 2L15 9L22 9L16 14L18 21L12 17L6 21L8 14L2 9L9 9Z"/>
        </svg>
        AD
      </div>
    </div>
    <div class="header-right">
      <div class="balance-pill">
        <span id="bal-text">0.00</span>
        <div class="balance-coin">ETB</div>
      </div>

      <!-- Pure SVG Chat Icon (No Emoji) -->
      <button class="icon-btn" title="Chat">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </button>

      <!-- Pure SVG Hamburger Icon (No Emoji) -->
      <button class="icon-btn" title="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Error Toast with Pure SVG Alert and Close -->
  <div id="toast">
    <svg class="toast-icon" viewBox="0 0 24 24">
      <path d="M12 2L1 21h22L12 2zm0 3.5L20 19H4L12 5.5zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"/>
    </svg>
    <span id="toast-msg">Insufficient funds</span>
    <span class="toast-close" onclick="hideToast()">
      <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </span>
  </div>

  <!-- Game Canvas / World Viewport -->
  <div id="world-viewport">
    <!-- Win Floating Banner -->
    <div id="win-pill">
      <div class="win-tag">WIN!</div>
      <div class="win-val" id="win-amount">0.00 ETB</div>
    </div>

    <!-- Scrolling Track -->
    <div id="world-track">
      <!-- Sidewalk Start Lane -->
      <div class="sidewalk-area">
        <div class="grass-strip">
          <div class="bush" style="width:34px; height:34px; top:30px; left:8px;"></div>
          <div class="bush" style="width:40px; height:40px; top:190px; left:4px;"></div>
          <div class="bush" style="width:30px; height:30px; top:290px; left:10px;"></div>
        </div>
        <div class="lamp-glow"></div>
        <!-- SVG Street Lamp -->
        <svg class="lamp-post" width="46" height="120" viewBox="0 0 46 120">
          <path d="M12,120 L12,30 Q12,6 30,6 L38,6" fill="none" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/>
          <ellipse cx="12" cy="116" rx="10" ry="4" fill="#4b5563"/>
          <path d="M30,6 L44,14 L36,18 Z" fill="#9ca3af"/>
          <polygon points="34,16 44,14 40,24" fill="#fde047" opacity="0.9"/>
        </svg>
      </div>

      <!-- Road Lanes Container -->
      <div id="lanes-box" style="display:flex;"></div>
    </div>

    <!-- Chicken Entity with Your Provided PNG -->
    <div id="chicken">
      <img src="https://i.postimg.cc/FzfP0m6N/20260930-163717.png" alt="Chicken" class="chicken-img" id="chicken-sprite">
      <div id="mult-bubble">1.03x</div>
    </div>
  </div>

  <!-- Bottom Control Panel -->
  <div id="control-panel">
    <!-- Stepper Row -->
    <div class="stepper-row">
      <button class="step-btn" onclick="setBet('MIN')">MIN</button>
      <input type="number" id="bet-input" class="bet-input-box" value="4" min="1" max="1000" step="1">
      <button class="step-btn" onclick="setBet('MAX')">MAX</button>
    </div>

    <!-- Quick Bet Chips -->
    <div class="chips-row">
      <button class="chip-btn" onclick="setQuickBet(4)">4 <span class="chip-sub">ETB</span></button>
      <button class="chip-btn" onclick="setQuickBet(8)">8 <span class="chip-sub">ETB</span></button>
      <button class="chip-btn" onclick="setQuickBet(12)">12 <span class="chip-sub">ETB</span></button>
      <button class="chip-btn" onclick="setQuickBet(20)">20 <span class="chip-sub">ETB</span></button>
    </div>

    <!-- Difficulty Selector with Pure SVG Arrows & Checks -->
    <div class="dropdown-container" id="diff-box">
      <div class="dropdown-trigger" onclick="toggleDropdown()">
        <span id="diff-label">Easy</span>
        <svg class="dropdown-arrow" viewBox="0 0 24 24">
          <path d="M7 10l5 5 5-5z"/>
        </svg>
      </div>
      <div class="dropdown-menu" id="diff-menu">
        <div class="dropdown-item active" onclick="selectDifficulty('Easy')">
          <span>Easy</span>
          <svg width="14" height="14" viewBox="0 0 24 24" stroke="#f59e0b" stroke-width="3" fill="none"><path d="M4 12l5 5L20 6"/></svg>
        </div>
        <div class="dropdown-item" onclick="selectDifficulty('Medium')">
          <span>Medium</span>
          <span></span>
        </div>
        <div class="dropdown-item" onclick="selectDifficulty('Hard')">
          <span>Hard</span>
          <span></span>
        </div>
        <div class="dropdown-item" onclick="selectDifficulty('Hardcore')">
          <span>Hardcore</span>
          <span></span>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions-row">
      <button id="btn-play" class="big-btn btn-play" onclick="handlePlayClick()">Play</button>
      <div id="ingame-btns" class="ingame-btns">
        <button id="btn-cashout" class="big-btn btn-cashout" onclick="handleCashOut()">
          <div>CASH OUT</div>
          <span id="cashout-val">0.00 ETB</span>
        </button>
        <button id="btn-go" class="big-btn btn-go" onclick="handleGoStep()">GO</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   1. MANDATORY BOILERPLATE & SERVER COMMUNICATION
   ========================================================================== */
const API = "https://hulubet-server.onrender.com";
let INIT_DATA = "", serverBalance = 0, ready = false;

async function api(path, opts = {}) {
  try {
    const r = await fetch(API + path, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        'x-telegram-init-data': INIT_DATA
      }
    });
    return await r.json();
  } catch (e) {
    return { success: false, message: 'Connection problem' };
  }
}
const postParent = m => { try { parent.postMessage(m, '*'); } catch (e) {} };

addEventListener('message', e => {
  if (e.source !== parent) return;
  const d = e.data || {};
  if (d.type === 'INIT' && d.initData) {
    INIT_DATA = d.initData;
    ready = true;
    refreshBalance();
  }
  if (d.type === 'UPDATE_BALANCE') refreshBalance();
});
postParent({ type: 'GAME_READY' });

async function refreshBalance() {
  const d = await api('/api/user/init');
  if (d.success) {
    serverBalance = d.balance;
    showBalance();
  }
}
function showBalance() {
  document.getElementById('bal-text').textContent = Number(serverBalance).toFixed(2);
  postParent({ type: 'BALANCE_UPDATE', newBalance: serverBalance });
}

/* ==========================================================================
   2. PROCEDURAL WEB AUDIO (WITH REALISTIC CHICKEN SQUAWK SOUND)
   ========================================================================== */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, type = 'sine', duration = 0.12, gainVal = 0.25) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

const soundHop = () => {
  playTone(520, 'sine', 0.08, 0.25);
  setTimeout(() => playTone(680, 'sine', 0.1, 0.2), 40);
};

const soundWin = () => {
  [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.22, 0.3), i * 75));
};

// Realistic Chicken Screech / Squawk when hit by a car
const soundChickenSquawk = () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;

  // 1. Car Horn Blare
  const horn1 = audioCtx.createOscillator();
  const horn2 = audioCtx.createOscillator();
  const hornGain = audioCtx.createGain();
  horn1.type = 'sawtooth';
  horn2.type = 'sawtooth';
  horn1.frequency.setValueAtTime(370, now);
  horn2.frequency.setValueAtTime(466, now);
  hornGain.gain.setValueAtTime(0.3, now);
  hornGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
  horn1.connect(hornGain);
  horn2.connect(hornGain);
  hornGain.connect(audioCtx.destination);
  horn1.start(now);
  horn2.start(now);
  horn1.stop(now + 0.45);
  horn2.stop(now + 0.45);

  // 2. High-Pitched Chicken Scream ("BAAWWWK!")
  const squawkOsc = audioCtx.createOscillator();
  const squawkGain = audioCtx.createGain();
  squawkOsc.type = 'sawtooth';
  // Rapid pitch bend dropping from 1200Hz down to 350Hz
  squawkOsc.frequency.setValueAtTime(1150, now + 0.05);
  squawkOsc.frequency.exponentialRampToValueAtTime(320, now + 0.48);

  // Vibrato modulation for alarmed flutter
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.frequency.setValueAtTime(35, now);
  lfoGain.gain.setValueAtTime(140, now);
  lfo.connect(squawkOsc.frequency);
  lfo.start(now + 0.05);
  lfo.stop(now + 0.5);

  squawkGain.gain.setValueAtTime(0.001, now);
  squawkGain.gain.linearRampToValueAtTime(0.5, now + 0.08);
  squawkGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

  squawkOsc.connect(squawkGain);
  squawkGain.connect(audioCtx.destination);
  squawkOsc.start(now + 0.05);
  squawkOsc.stop(now + 0.5);
};

/* ==========================================================================
   3. MULTIPLIERS & SPEED PER DIFFICULTY
   ========================================================================== */
const MULTIPLIERS = {
  Easy:     [1.01, 1.03, 1.06, 1.10, 1.15, 1.22, 1.30, 1.44, 1.62, 1.90, 2.25, 2.80],
  Medium:   [1.05, 1.15, 1.30, 1.55, 1.95, 2.60, 3.60, 5.20, 8.00, 13.0, 22.0, 40.0],
  Hard:     [1.18, 1.50, 2.10, 3.20, 5.50, 10.0, 20.0, 45.0, 100.0, 250.0],
  Hardcore: [1.50, 2.50, 5.00, 12.0, 30.0, 80.0, 250.0, 800.0]
};

// Continuous Traffic Durations (Easy = slow, Hardcore = very fast)
const TRAFFIC_SPEEDS = {
  Easy: '6.5s',
  Medium: '4.2s',
  Hard: '2.6s',
  Hardcore: '1.5s'
};

let currentDifficulty = 'Easy';
let activeRound = null;
let currentStepIndex = 0; // 0 = on sidewalk

/* ==========================================================================

/* ==========================================================================
   5. TRACK & LANES GENERATION
   ========================================================================== */
function buildTrack() {
  const lanesBox = document.getElementById('lanes-box');
  lanesBox.innerHTML = '';
  const mults = MULTIPLIERS[currentDifficulty];

  // Set current speed CSS variable
  document.documentElement.style.setProperty('--traffic-duration', TRAFFIC_SPEEDS[currentDifficulty]);

  mults.forEach((m, idx) => {
    const laneDiv = document.createElement('div');
    laneDiv.className = 'lane';
    laneDiv.id = `lane-${idx}`;

    // Select car type alternating
    const carTypes = [getYellowTruckSvg(), getFireEngineSvg(), getIceCreamTruckSvg()];
    const chosenCar = carTypes[idx % carTypes.length];

    // Stagger animation delay across lanes
    const animDelay = -(idx * 1.35) % 4;

    laneDiv.innerHTML = `
      <!-- Moving Traffic Vehicle -->
      <div class="traffic-car-container driving-active" id="traffic-${idx}" style="animation-delay: ${animDelay}s;">
        ${chosenCar}
      </div>

      <!-- Safety Barricade (Braker) -->
      <div class="lane-barricade" id="barricade-${idx}">
        ${getBarricadeSvg()}
      </div>

      <!-- Manhole Step -->
      <div class="manhole" id="manhole-${idx}">
        <div class="manhole-bars"></div>
        <div class="manhole-mult">${m.toFixed(2)}x</div>
      </div>
    `;
    lanesBox.appendChild(laneDiv);
  });
}

/* ==========================================================================
   6. CONTROLS & DROPDOWN (NO EMOJIS)
   ========================================================================== */
function setBet(type) {
  const input = document.getElementById('bet-input');
  if (type === 'MIN') input.value = 1;
  if (type === 'MAX') input.value = Math.min(1000, Math.floor(serverBalance) || 1000);
}
function setQuickBet(val) {
  document.getElementById('bet-input').value = val;
}

function toggleDropdown() {
  if (activeRound) return;
  document.getElementById('diff-menu').classList.toggle('open');
}

function selectDifficulty(diff) {
  currentDifficulty = diff;
  document.getElementById('diff-label').textContent = diff;
  document.querySelectorAll('.dropdown-item').forEach(el => {
    const isTarget = el.textContent.includes(diff);
    el.classList.toggle('active', isTarget);
    el.children[1].innerHTML = isTarget 
      ? `<svg width="14" height="14" viewBox="0 0 24 24" stroke="#f59e0b" stroke-width="3" fill="none"><path d="M4 12l5 5L20 6"/></svg>` 
      : '';
  });
  document.getElementById('diff-menu').classList.remove('open');
  buildTrack();
  resetChickenPosition();
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  toast.classList.add('show');
  setTimeout(hideToast, 4000);
}
function hideToast() {
  document.getElementById('toast').classList.remove('show');
}

/* ==========================================================================
   7. CHICKEN MOVEMENT & BARRICADE (BRAKER) LOGIC
   ========================================================================== */
function resetChickenPosition() {
  const chicken = document.getElementById('chicken');
  const bubble = document.getElementById('mult-bubble');
  chicken.style.left = '70px';
  chicken.style.bottom = '130px';
  chicken.style.transform = 'translate(-50%, 0)';
  chicken.style.filter = 'none';
  bubble.style.display = 'none';
  document.getElementById('world-track').style.transform = 'translateX(0px)';
  document.getElementById('win-pill').classList.remove('show');

  // Clear barricades & restore traffic
  document.querySelectorAll('.lane-barricade').forEach(b => b.classList.remove('deployed'));
  document.querySelectorAll('.traffic-car-container').forEach(c => {
    c.classList.remove('blocked-by-barrier', 'speed-crash');
    c.classList.add('driving-active');
  });
}

function positionChickenAtStep(stepIdx) {
  const chicken = document.getElementById('chicken');
  const bubble = document.getElementById('mult-bubble');
  const viewport = document.getElementById('world-viewport');
  const mults = MULTIPLIERS[currentDifficulty];

  soundHop();

  // Lane position (sidewalk is 140px, each lane is 130px)
  const targetX = 140 + stepIdx * 130 + 65;
  chicken.style.left = targetX + 'px';
  chicken.style.bottom = '135px';

  // Multiplier bubble update
  const m = mults[stepIdx] || mults[mults.length - 1];
  bubble.textContent = `${m.toFixed(2)}x`;
  bubble.style.display = 'block';

  // Dim passed manhole
  const mh = document.getElementById(`manhole-${stepIdx}`);
  if (mh) mh.classList.add('passed');

  // DEPLOY BARRICADE (BRAKER) TO PROTECT CHICKEN FROM INCOMING CARS
  const barricade = document.getElementById(`barricade-${stepIdx}`);
  if (barricade) {
    barricade.classList.add('deployed');
  }

  // STOP INCOMING CAR AT BARRICADE
  const trafficCar = document.getElementById(`traffic-${stepIdx}`);
  if (trafficCar) {
    trafficCar.classList.remove('driving-active');
    trafficCar.classList.add('blocked-by-barrier');
  }

  // Camera tracking
  const viewportWidth = viewport.clientWidth;
  const cameraX = Math.max(0, targetX - viewportWidth / 2);
  document.getElementById('world-track').style.transform = `translateX(-${cameraX}px)`;
}

/* ==========================================================================
   8. GAMEPLAY ACTIONS (SERVER AUTHORITATIVE)
   ========================================================================== */
async function handlePlayClick() {
  if (activeRound) return;

  const bet = parseFloat(document.getElementById('bet-input').value) || 0;
  if (bet < 1 || bet > 1000) {
    showToast("Bet must be between 1 and 1000 ETB");
    return;
  }
  if (bet > serverBalance) {
    showToast("Insufficient funds");
    postParent({ type: 'OPEN_DEPOSIT' });
    return;
  }

  const playBtn = document.getElementById('btn-play');
  playBtn.classList.add('btn-disabled');
  playBtn.textContent = "Connecting...";

  // 1. Authoritative bet API call
  const res = await api('/api/bet/play', {
    method: 'POST',
    body: JSON.stringify({
      gameName: "ChickenRoad2",
      betAmount: bet,
      clientData: { difficulty: currentDifficulty }
    })
  });

  playBtn.classList.remove('btn-disabled');
  playBtn.textContent = "Play";

  if (!res.success) {
    showToast(res.message || "Failed to place bet");
    if (res.message && res.message.toLowerCase().includes("balance")) {
      postParent({ type: 'OPEN_DEPOSIT' });
    }
    return;
  }

  // Local deduction for instant response; authoritative balance follows
  serverBalance -= bet;
  showBalance();
  postParent({ type: 'BET_STARTED' });

  // 2. Active round setup
  currentStepIndex = 0;
  buildTrack();
  resetChickenPosition();

  activeRound = {
    betAmount: bet,
    isWin: res.isWin,
    payout: res.payout,
    multiplier: res.multiplier,
    newBalance: res.newBalance,
    maxSafeStep: (res.visualOutcome && typeof res.visualOutcome.maxSafeStep === 'number')
                   ? res.visualOutcome.maxSafeStep
                   : (res.isWin ? MULTIPLIERS[currentDifficulty].length : 0)
  };

  // Switch to in-game buttons
  document.getElementById('btn-play').style.display = 'none';
  document.getElementById('ingame-btns').style.display = 'grid';
  document.getElementById('diff-box').style.pointerEvents = 'none';
  document.getElementById('diff-box').style.opacity = '0.7';

  updateCashOutLabel();
}

function updateCashOutLabel() {
  const mults = MULTIPLIERS[currentDifficulty];
  const curMult = currentStepIndex > 0 ? mults[currentStepIndex - 1] : 1.00;
  const currentPayout = (activeRound.betAmount * curMult).toFixed(2);
  document.getElementById('cashout-val').textContent = `${currentPayout} ETB`;
}

function handleGoStep() {
  if (!activeRound) return;

  const goBtn = document.getElementById('btn-go');
  const cashBtn = document.getElementById('btn-cashout');
  goBtn.classList.add('btn-disabled');
  cashBtn.classList.add('btn-disabled');

  const nextStep = currentStepIndex;
  const mults = MULTIPLIERS[currentDifficulty];

  // If safe according to server result:
  if (nextStep < activeRound.maxSafeStep && nextStep < mults.length) {
    positionChickenAtStep(nextStep);
    currentStepIndex++;
    updateCashOutLabel();

    setTimeout(() => {
      // Reached finish successfully!
      if (currentStepIndex >= mults.length || (currentStepIndex >= activeRound.maxSafeStep && activeRound.isWin)) {
        completeWin();
      } else {
        goBtn.classList.remove('btn-disabled');
        cashBtn.classList.remove('btn-disabled');
      }
    }, 350);

  } else {
    // Loss: No barricade drops, vehicle crashes into chicken!
    triggerCarCrash(nextStep);
  }
}

function handleCashOut() {
  if (!activeRound) return;
  if (activeRound.isWin) {
    completeWin();
  } else {
    triggerCarCrash(currentStepIndex);
  }
}

function triggerCarCrash(laneIdx) {
  soundChickenSquawk();

  const chicken = document.getElementById('chicken');
  const viewport = document.getElementById('world-viewport');
  const targetX = 140 + laneIdx * 130 + 65;

  // Hop into danger lane
  chicken.style.left = targetX + 'px';

  // NO BARRICADE DEPLOYS ON CRASH!
  // Car speeds directly down into the chicken
  const trafficCar = document.getElementById(`traffic-${laneIdx}`);
  if (trafficCar) {
    trafficCar.classList.remove('driving-active');
    trafficCar.classList.add('speed-crash');
  }

  // Crash animation on chicken
  setTimeout(() => {
    chicken.style.transform = 'translate(-50%, 15px) rotate(90deg) scale(0.85)';
    chicken.style.filter = 'grayscale(1) brightness(0.7)';
  }, 100);

  showToast("Hit by car! Round Over");

  setTimeout(() => {
    endRound(activeRound.newBalance);
  }, 1700);
}

function completeWin() {
  soundWin();
  const winPill = document.getElementById('win-pill');
  document.getElementById('win-amount').textContent = `${Number(activeRound.payout).toFixed(2)} ETB`;
  winPill.classList.add('show');

  const chicken = document.getElementById('chicken');
  chicken.style.bottom = '160px';

  setTimeout(() => {
    endRound(activeRound.newBalance);
  }, 2200);
}

function endRound(authoritativeBalance) {
  serverBalance = authoritativeBalance;
  showBalance();
  postParent({ type: 'BET_ENDED' });

  activeRound = null;
  currentStepIndex = 0;

  // Reset controls
  document.getElementById('btn-play').style.display = 'flex';
  document.getElementById('ingame-btns').style.display = 'none';
  document.getElementById('btn-go').classList.remove('btn-disabled');
  document.getElementById('btn-cashout').classList.remove('btn-disabled');
  document.getElementById('diff-box').style.pointerEvents = 'auto';
  document.getElementById('diff-box').style.opacity = '1';

  resetChickenPosition();
}

/* Initialize Game on Load */
window.addEventListener('load', () => {
  buildTrack();
  resetChickenPosition();

  // Close dropdown on outside tap
  document.addEventListener('click', e => {
    if (!document.getElementById('diff-box').contains(e.target)) {
      document.getElementById('diff-menu').classList.remove('open');
    }
  });
});
</script>
